<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سينما قرمزي | للمسلسلات</title>
    <style>
        /* --- الألوان والتنسيق العام --- */
        :root {
            --bg-color: #0b0f17;
            --card-bg: #151f30;
            --accent-color: #ff2a5f;
            --hover-color: #ff527b;
            --text-color: #ffffff;
            --text-secondary: #8f9cae;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* --- الهيدر والقائمة --- */
        header {
            background-color: rgba(21, 31, 48, 0.95);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: var(--accent-color);
            text-decoration: none;
        }

        .search-container {
            position: relative;
            max-width: 400px;
            width: 100%;
        }

        .search-input {
            width: 100%;
            padding: 10px 20px;
            border-radius: 25px;
            border: none;
            background-color: #222e43;
            color: #fff;
            font-size: 16px;
            outline: none;
            box-sizing: border-box;
        }

        /* --- الحاوية والشبكة --- */
        .container {
            max-width: 1300px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .section-title {
            font-size: 22px;
            margin-bottom: 20px;
            border-right: 4px solid var(--accent-color);
            padding-right: 10px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 20px;
        }

        /* --- كرت المسلسل --- */
        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 25px rgba(255, 42, 95, 0.2);
        }

        .card-img-wrapper {
            position: relative;
            width: 100%;
            height: 210px;
            overflow: hidden;
            background-color: #121924;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-title {
            padding: 10px;
            font-size: 13px;
            font-weight: 600;
            margin: 0;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* --- النافذة المنبثقة (Modal) --- */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            backdrop-filter: blur(8px);
        }

        .modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background-color: var(--card-bg);
            width: 95%;
            max-width: 650px;
            max-height: 80vh;
            border-radius: 16px;
            overflow-y: auto;
            position: relative;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .close-modal {
            position: absolute;
            top: 15px;
            left: 15px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            font-weight: bold;
            z-index: 10;
        }

        .details-header {
            display: flex;
            gap: 25px;
            margin-bottom: 25px;
            align-items: center;
            border-bottom: 2px solid #222e43;
            padding-bottom: 20px;
        }

        .details-poster {
            width: 100px;
            height: 145px;
            object-fit: cover;
            border-radius: 8px;
        }

        /* --- قائمة الحلقات --- */
        .episodes-section h3 {
            margin-bottom: 15px;
            color: var(--text-color);
        }

        .episodes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 12px;
        }

        .ep-link {
            background-color: #222e43;
            color: #fff;
            padding: 14px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s ease;
            text-align: center;
            font-size: 14px;
            text-decoration: none;
            display: block;
        }

        .ep-link:hover {
            background-color: var(--accent-color);
            box-shadow: 0 4px 12px rgba(255, 42, 95, 0.4);
            transform: scale(1.03);
        }

        .status-msg {
            text-align: center;
            font-size: 18px;
            color: var(--text-secondary);
            grid-column: 1 / -1;
            padding: 40px 0;
        }

        @media (max-width: 768px) {
            header { flex-direction: column; gap: 15px; padding: 15px; }
            .search-container { max-width: 100%; }
            .details-header { flex-direction: column; text-align: center; }
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo" onclick="displayAllLocalSeries()">🎬 سينما قرمزي</a>
        <div class="search-container">
            <input type="text" id="searchInput" class="search-input" placeholder="ابحث عن مسلسل...">
        </div>
    </header>

    <div class="container">
        <h2 id="sectionTitle" class="section-title">جميع المسلسلات المتاحة</h2>
        <div id="mainGrid" class="grid">
            <div class="status-msg">جاري تحميل مسلسلاتك المتاحة...</div>
        </div>
    </div>

    <div id="detailsModal" class="modal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeModal()">✕</button>
            <div id="modalDetails" class="details-header"></div>
            <div class="episodes-section">
                <h3>اختر الحلقة لفتح مشغل البث الفوري:</h3>
                <div id="episodesGrid" class="episodes-grid"></div>
            </div>
        </div>
    </div>

    <script>
        // الرابط الأساسي للسيرفر
        const BASE_API = "http://api.dfkz.site/krmzi/";
        // ممر التخطي الخارجي لمنع المتصفحات من إجبار حماية https على السيرفر
        const BYPASS_LINK = "https://href.li/?";

        const mainGrid = document.getElementById('mainGrid');
        const sectionTitle = document.getElementById('sectionTitle');
        const searchInput = document.getElementById('searchInput');
        
        let allLocalSeries = [];

        async function loadLocalJSON() {
            try {
                const response = await fetch('krmzi.json'); 
                const data = await response.json();
                if(data && data.series) {
                    allLocalSeries = data.series;
                    displayAllLocalSeries();
                } else {
                    mainGrid.innerHTML = '<div class="status-msg">تأكد من رفع ملف krmzi.json بشكل سليم.</div>';
                }
            } catch (error) {
                console.error("Error loading JSON:", error);
                mainGrid.innerHTML = '<div class="status-msg">خطأ في قراءة البيانات، يرجى مراجعة ملف الـ json.</div>';
            }
        }

        function displayAllLocalSeries() {
            sectionTitle.innerText = "جميع المسلسلات المتاحة";
            if(allLocalSeries.length > 0) {
                renderGrid(allLocalSeries);
            }
        }

        function searchLocalSeries(query) {
            if(!query.trim()) {
                displayAllLocalSeries();
                return;
            }
            sectionTitle.innerText = `نتائج البحث عن: ${query}`;
            const filtered = allLocalSeries.filter(item => 
                item.title.toLowerCase().includes(query.toLowerCase())
            );
            if(filtered.length > 0) {
                renderGrid(filtered);
            } else {
                mainGrid.innerHTML = '<div class="status-msg">لا توجد نتائج تطابق هذا العمل.</div>';
            }
        }

        function renderGrid(items) {
            mainGrid.innerHTML = '';
            items.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => showSeriesDetailsByIndex(index);
                card.innerHTML = `
                    <div class="card-img-wrapper">
                        <img src="${item.image}" alt="${item.title}" loading="lazy">
                    </div>
                    <h3 class="card-title" title="${item.title}">${item.title}</h3>
                `;
                mainGrid.appendChild(card);
            });
        }

        function showSeriesDetailsByIndex(index) {
            const item = allLocalSeries[index];
            if (!item) return;

            const modal = document.getElementById('detailsModal');
            const detailsContainer = document.getElementById('modalDetails');
            const episodesGrid = document.getElementById('episodesGrid');
            
            episodesGrid.innerHTML = '';
            modal.classList.add('active');

            detailsContainer.innerHTML = `
                <img src="${item.image}" class="details-poster" alt="${item.title}">
                <div>
                    <h2 style="font-size: 18px; margin: 0 0 5px 0; color: #fff;">${item.title}</h2>
                    <p style="color: var(--accent-color); margin: 0; font-size: 13px; font-weight: bold;">اضغط على الحلقة وسفتح لك سيرفر البث الأصلي مباشرة!</p>
                </div>
            `;

            // توليد 40 حلقة كاملة وجاهزة
            const totalEpisodes = 40; 

            for (let i = 1; i <= totalEpisodes; i++) {
                const epLink = document.createElement('a');
                epLink.className = 'ep-link';
                epLink.innerText = `الحلقة ${i}`;
                
                // هنا التعديل الجوهري والحل السحري: إرسال المتغيرات بصيغتها القانونية التي تطلبها قاعدة بيانات السيرفر
                const originalUrl = `${BASE_API}ep.php?id=${item.id}&ep=${i}`;
                
                epLink.href = `${BYPASS_LINK}${originalUrl}`;
                epLink.target = '_blank';
                epLink.rel = "noreferrer noopener";

                episodesGrid.appendChild(epLink);
            }
        }

        function closeModal() {
            const modal = document.getElementById('detailsModal');
            modal.classList.remove('active');
        }

        searchInput.addEventListener('input', (e) => {
            searchLocalSeries(e.target.value);
        });

        window.onload = loadLocalJSON;
    </script>
</body>
</html>
