<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سينما قرمزي | للمسلسلات</title>
    <style>
        /* --- الألوان والتنسيق العام --- */
        :root {
            --bg-color: #0b0f17;
            --card-bg: #151f30;
            --accent-color: #ff2a5f;
            --hover-color: #ff527b;
            --text-color: #ffffff;
            --text-secondary: #8f9cae;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* --- الهيدر والقائمة --- */
        header {
            background-color: rgba(21, 31, 48, 0.95);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: var(--accent-color);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .search-container {
            position: relative;
            max-width: 400px;
            width: 100%;
        }

        .search-input {
            width: 100%;
            padding: 10px 20px;
            border-radius: 25px;
            border: none;
            background-color: #222e43;
            color: #fff;
            font-size: 16px;
            outline: none;
            box-sizing: border-box;
        }

        /* --- الحاوية والشبكة --- */
        .container {
            max-width: 1300px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .section-title {
            font-size: 22px;
            margin-bottom: 20px;
            border-right: 4px solid var(--accent-color);
            padding-right: 10px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 20px;
        }

        /* --- كرت المسلسل --- */
        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 25px rgba(255, 42, 95, 0.2);
        }

        .card-img-wrapper {
            position: relative;
            width: 100%;
            height: 210px;
            overflow: hidden;
            background-color: #121924;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .card:hover img {
            transform: scale(1.05);
        }

        .card-title {
            padding: 10px;
            font-size: 13px;
            font-weight: 600;
            margin: 0;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* --- النافذة المنبثقة (Modal) --- */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            backdrop-filter: blur(8px);
        }

        .modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background-color: var(--card-bg);
            width: 95%;
            max-width: 900px;
            height: 90vh;
            border-radius: 16px;
            overflow-y: auto;
            position: relative;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .close-modal {
            position: absolute;
            top: 15px;
            left: 15px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            font-weight: bold;
            z-index: 10;
        }

        /* --- تفاصيل المسلسل والمشغل --- */
        .details-header {
            display: flex;
            gap: 25px;
            margin-bottom: 30px;
            align-items: center;
        }

        .details-poster {
            width: 120px;
            height: 170px;
            object-fit: cover;
            border-radius: 8px;
        }

        .player-container {
            width: 100%;
            height: 450px;
            background-color: #000;
            border-radius: 12px;
            margin-bottom: 25px;
            display: none;
        }

        .player-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 12px;
        }

        /* --- قائمة الحلقات --- */
        .episodes-section h3 {
            margin-bottom: 15px;
            border-bottom: 2px solid #222e43;
            padding-bottom: 8px;
        }

        .episodes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            gap: 10px;
        }

        .ep-btn {
            background-color: #222e43;
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s ease;
            text-align: center;
            font-size: 13px;
        }

        .ep-btn:hover, .ep-btn.active {
            background-color: var(--accent-color);
        }

        .status-msg {
            text-align: center;
            font-size: 18px;
            color: var(--text-secondary);
            grid-column: 1 / -1;
            padding: 40px 0;
        }

        @media (max-width: 768px) {
            header { flex-direction: column; gap: 15px; padding: 15px; }
            .search-container { max-width: 100%; }
            .details-header { flex-direction: column; text-align: center; }
            .player-container { height: 230px; }
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo" onclick="displayAllLocalSeries()">🎬 سينما قرمزي</a>
        <div class="search-container">
            <input type="text" id="searchInput" class="search-input" placeholder="ابحث عن مسلسل...">
        </div>
    </header>

    <div class="container">
        <h2 id="sectionTitle" class="section-title">جميع المسلسلات المتاحة</h2>
        <div id="mainGrid" class="grid">
            <div class="status-msg">جاري تحميل مسلسلاتك المتاحة...</div>
        </div>
    </div>

    <div id="detailsModal" class="modal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeModal()">✕</button>
            <div id="playerContainer" class="player-container"></div>
            <div id="modalDetails" class="details-header"></div>
            <div class="episodes-section">
                <h3>حلقات المسلسل</h3>
                <div id="episodesGrid" class="episodes-grid"></div>
            </div>
        </div>
    </div>

    <script>
        const BASE_API = "https://api.dfkz.site/krmzi/";
        const mainGrid = document.getElementById('mainGrid');
        const sectionTitle = document.getElementById('sectionTitle');
        const searchInput = document.getElementById('searchInput');
        
        let allLocalSeries = [];

        // تصحيح بروتوكول الصور لتعمل بشكل آمن تماماً
        function fixImageUrl(url) {
            if (!url) return 'https://via.placeholder.com/140x210';
            if (url.startsWith('http://')) {
                return url.replace('http://', 'https://');
            }
            return url;
        }

        // جلب البيانات بدقة من krmzi.json الصغير المتوافق مع الرفع الحالي
        async function loadLocalJSON() {
            try {
                const response = await fetch('krmzi.json'); 
                const data = await response.json();
                if(data && data.series) {
                    allLocalSeries = data.series;
                    displayAllLocalSeries();
                } else {
                    mainGrid.innerHTML = '<div class="status-msg">تأكد من رفع ملف krmzi.json في نفس المجلد.</div>';
                }
            } catch (error) {
                console.error("Error loading JSON:", error);
                mainGrid.innerHTML = '<div class="status-msg">خطأ في قراءة البيانات، يرجى التحقق من الملف المرفوع.</div>';
            }
        }

        function displayAllLocalSeries() {
            sectionTitle.innerText = "جميع المسلسلات المتاحة";
            if(allLocalSeries.length > 0) {
                renderGrid(allLocalSeries);
            } else {
                mainGrid.innerHTML = '<div class="status-msg">جاري بناء الواجهة السينمائية...</div>';
            }
        }

        function searchLocalSeries(query) {
            if(!query.trim()) {
                displayAllLocalSeries();
                return;
            }
            sectionTitle.innerText = `نتائج البحث عن: ${query}`;
            
            const filtered = allLocalSeries.filter(item => 
                item.title.toLowerCase().includes(query.toLowerCase())
            );

            if(filtered.length > 0) {
                renderGrid(filtered);
            } else {
                mainGrid.innerHTML = '<div class="status-msg">لا توجد نتائج تطابق هذا العمل.</div>';
            }
        }

        function renderGrid(items) {
            mainGrid.innerHTML = '';
            items.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                
                // هنا تم إصلاح الربط بدقة ليستدعي الدالة الصحيحة عند الضغط بـ Index مخصص
                card.onclick = () => showSeriesDetailsByIndex(index);

                const securedImg = fixImageUrl(item.image);

                card.innerHTML = `
                    <div class="card-img-wrapper">
                        <img src="${securedImg}" alt="${item.title}" loading="lazy">
                    </div>
                    <h3 class="card-title" title="${item.title}">${item.title}</h3>
                `;
                mainGrid.appendChild(card);
            });
        }

        // الدالة المحدثة والمربوطة بالكامل لعرض التفاصيل وتوليد الحلقات الـ 40 مباشرة
        function showSeriesDetailsByIndex(index) {
            const item = allLocalSeries[index];
            if (!item) return;

            const modal = document.getElementById('detailsModal');
            const detailsContainer = document.getElementById('modalDetails');
            const episodesGrid = document.getElementById('episodesGrid');
            const playerContainer = document.getElementById('playerContainer');
            
            playerContainer.style.display = 'none';
            playerContainer.innerHTML = '';
            episodesGrid.innerHTML = '';
            
            modal.classList.add('active');

            const securedPoster = fixImageUrl(item.image);

            detailsContainer.innerHTML = `
                <img src="${securedPoster}" class="details-poster" alt="${item.title}">
                <div>
                    <h2 style="font-size: 18px; margin: 0 0 5px 0;">${item.title}</h2>
                    <p style="color: var(--text-secondary); margin: 0; font-size: 13px;">المعرف المرجعي: ${item.id}</p>
                </div>
            `;

            // توليد 40 حلقة تلقائياً ومباشرة لكل مسلسل لتغطية الحلقات بالكامل
            const totalEpisodes = 40; 

            for (let i = 1; i <= totalEpisodes; i++) {
                const epBtn = document.createElement('button');
                epBtn.className = 'ep-btn';
                epBtn.innerText = `الحلقة ${i}`;
                
                epBtn.onclick = () => {
                    document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active'));
                    epBtn.classList.add('active');
                    
                    // توليد كود البث الفريد للسيرفر المشغل
                    const generatedEpId = `${item.id}ep${i}`;
                    watchEpisode(generatedEpId);
                };
                episodesGrid.appendChild(epBtn);
            }
        }

        // تشغيل البث بشكل فوري آمن ومستقر داخل الموقع
        function watchEpisode(episodeId) {
            const playerContainer = document.getElementById('playerContainer');
            playerContainer.style.display = 'block';
            playerContainer.innerHTML = `
                <iframe src="${BASE_API}ep.php?epid=${episodeId}" allowfullscreen scrolling="no"></iframe>
            `;
            document.getElementById('detailsModal').querySelector('.modal-content').scrollTop = 0;
        }

        function closeModal() {
            const modal = document.getElementById('detailsModal');
            const playerContainer = document.getElementById('playerContainer');
            modal.classList.remove('active');
            playerContainer.innerHTML = ''; 
        }

        searchInput.addEventListener('input', (e) => {
            searchLocalSeries(e.target.value);
        });

        window.onload = loadLocalJSON;
    </script>
</body>
</html>
