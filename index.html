<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medo TV - أفلام ومسلسلات</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">
                <i class="fas fa-tv"></i>
                <span>Medo TV</span>
            </div>
            <div class="nav-search">
                <input type="text" id="searchInput" placeholder="ابحث عن فيلم أو مسلسل...">
                <button id="searchBtn"><i class="fas fa-search"></i></button>
            </div>
            <div class="nav-menu">
                <button class="nav-btn active" data-filter="all">الكل</button>
                <button class="nav-btn" data-filter="favorites"><i class="fas fa-heart"></i> المفضلة</button>
                <button class="nav-btn" data-filter="watching"><i class="fas fa-play"></i> قيد المشاهدة</button>
            </div>
        </div>
    </nav>

    <!-- Loading Spinner -->
    <div id="loading" class="loading">
        <div class="spinner"></div>
        <p>جاري التحميل...</p>
    </div>

    <!-- Error Message -->
    <div id="errorMsg" class="error-message"></div>

    <!-- Main Content -->
    <main class="container">
        <!-- Filter Section -->
        <section class="filters-section">
            <h2>التصنيفات</h2>
            <div class="filters">
                <button class="filter-btn active" data-category="all">الكل (1332)</button>
                <button class="filter-btn" data-category="ramadan">رمضان</button>
                <button class="filter-btn" data-category="khaliji">خليجي</button>
                <button class="filter-btn" data-category="arabic">عربي</button>
                <button class="filter-btn" data-category="turkish">تركي</button>
                <button class="filter-btn" data-category="foreign">أجنبي</button>
            </div>
        </section>

        <!-- Content Grid -->
        <section class="content-section">
            <div id="contentGrid" class="content-grid">
                <!-- Content items will be inserted here -->
            </div>
        </section>

        <!-- Pagination -->
        <section class="pagination-section">
            <button id="prevBtn" class="pagination-btn"><i class="fas fa-chevron-right"></i> السابق</button>
            <span id="pageInfo" class="page-info">الصفحة 1</span>
            <button id="nextBtn" class="pagination-btn">التالي <i class="fas fa-chevron-left"></i></button>
        </section>
    </main>

    <!-- Modal for Details -->
    <div id="detailsModal" class="modal">
        <div class="modal-content">
            <button class="modal-close">&times;</button>
            <div class="modal-body">
                <div class="details-image">
                    <img id="detailsImage" src="" alt="">
                </div>
                <div class="details-info">
                    <h1 id="detailsTitle"></h1>
                    <p id="detailsEpisodes"></p>
                    <div class="modal-buttons">
                        <button id="playBtn" class="btn btn-primary">
                            <i class="fas fa-play"></i> شاهد الآن
                        </button>
                        <button id="favoriteBtn" class="btn btn-secondary">
                            <i class="fas fa-heart"></i> إضافة للمفضلة
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Video Player Modal -->
    <div id="playerModal" class="modal">
        <div class="modal-content player-modal">
            <button class="modal-close">&times;</button>
            <div class="player-container">
                <video id="videoPlayer" controls></video>
                <div id="episodesList" class="episodes-list">
                    <!-- Episodes will be listed here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2024 Medo TV - جميع الحقوق محفوظة</p>
        <p>مصدر البيانات: <a href="https://api.dfkz.site/alooy/" target="_blank">Alooy API</a></p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
